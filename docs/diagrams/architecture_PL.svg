<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" font-family="Segoe UI, sans-serif" font-size="13">
  <defs>
    <style>
      .vm   { fill: #f7fbff; stroke: #336791; stroke-width: 1.5; }
      .infra{ fill: #e6f4ea; stroke: #1b873b; stroke-width: 1.5; }
      .lb   { fill: #fff3e0; stroke: #e69500; stroke-width: 1.5; }
      .cli  { fill: #f3e8ff; stroke: #6f42c1; stroke-width: 1.5; }
      .host { fill: #f8f9fa; stroke: #444;    stroke-width: 1.5; }
      .lbl  { font-weight: 600; fill: #1a1a1a; }
      .sub  { font-size: 11px; fill: #555; }
      .arr  { stroke: #555; stroke-width: 1; fill: none; marker-end: url(#arr); }
      .arrd { stroke: #555; stroke-width: 1; fill: none; marker-end: url(#arr); stroke-dasharray: 4 3; }
    </style>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#555"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="450" y="28" text-anchor="middle" class="lbl" font-size="18">PostgreSQL 18 HA Lab — architektura</text>
  <text x="450" y="48" text-anchor="middle" class="sub">Domena: lab.test · Sieć: vboxnet0 (192.168.56.0/24)</text>

  <!-- Host (Windows 11) -->
  <rect x="20" y="80" width="200" height="120" rx="6" class="host"/>
  <text x="120" y="105" text-anchor="middle" class="lbl">Host Windows 11</text>
  <text x="120" y="125" text-anchor="middle" class="sub">PowerShell 5.1+ · VBoxManage</text>
  <text x="120" y="145" text-anchor="middle" class="sub">.\lab.ps1 build</text>
  <text x="120" y="165" text-anchor="middle" class="sub">NRPT: *.lab.test → 192.168.56.10</text>
  <text x="120" y="185" text-anchor="middle" class="sub">Serwer KS HTTP (192.168.56.1:8000)</text>

  <!-- Infra -->
  <rect x="270" y="80" width="160" height="80" rx="6" class="infra"/>
  <text x="350" y="105" text-anchor="middle" class="lbl">infra.lab.test</text>
  <text x="350" y="125" text-anchor="middle" class="sub">192.168.56.10</text>
  <text x="350" y="145" text-anchor="middle" class="sub">Unbound (DNS) · chronyd (NTP)</text>

  <!-- pg1 / pg2 / pg3 -->
  <rect x="270" y="200" width="120" height="80" rx="6" class="vm"/>
  <text x="330" y="220" text-anchor="middle" class="lbl">pg1</text>
  <text x="330" y="238" text-anchor="middle" class="sub">192.168.56.11</text>
  <text x="330" y="256" text-anchor="middle" class="sub">PG 18 + Patroni</text>
  <text x="330" y="272" text-anchor="middle" class="sub">+ etcd</text>

  <rect x="410" y="200" width="120" height="80" rx="6" class="vm"/>
  <text x="470" y="220" text-anchor="middle" class="lbl">pg2</text>
  <text x="470" y="238" text-anchor="middle" class="sub">192.168.56.12</text>
  <text x="470" y="256" text-anchor="middle" class="sub">PG 18 + Patroni</text>
  <text x="470" y="272" text-anchor="middle" class="sub">+ etcd</text>

  <rect x="550" y="200" width="120" height="80" rx="6" class="vm"/>
  <text x="610" y="220" text-anchor="middle" class="lbl">pg3</text>
  <text x="610" y="238" text-anchor="middle" class="sub">192.168.56.13</text>
  <text x="610" y="256" text-anchor="middle" class="sub">PG 18 + Patroni</text>
  <text x="610" y="272" text-anchor="middle" class="sub">+ etcd</text>

  <!-- lb -->
  <rect x="270" y="320" width="160" height="80" rx="6" class="lb"/>
  <text x="350" y="345" text-anchor="middle" class="lbl">lb.lab.test</text>
  <text x="350" y="365" text-anchor="middle" class="sub">192.168.56.20</text>
  <text x="350" y="385" text-anchor="middle" class="sub">HAProxy :5000/:5001 · PgBouncer :6432</text>

  <!-- cli -->
  <rect x="510" y="320" width="160" height="80" rx="6" class="cli"/>
  <text x="590" y="345" text-anchor="middle" class="lbl">cli.lab.test</text>
  <text x="590" y="365" text-anchor="middle" class="sub">192.168.56.30</text>
  <text x="590" y="385" text-anchor="middle" class="sub">orchestrator + klient pgha</text>

  <!-- arrows -->
  <!-- KS server to all VMs (dashed) -->
  <path class="arrd" d="M220,140 C240,140 250,140 270,120"/>

  <!-- DNS+NTP to PG nodes -->
  <path class="arr" d="M330,160 L330,200"/>
  <path class="arr" d="M470,160 L470,200"/>
  <path class="arr" d="M610,160 L610,200"/>

  <!-- DNS+NTP to lb / cli -->
  <path class="arr" d="M380,160 C380,260 380,300 350,320"/>
  <path class="arr" d="M420,160 C420,280 540,280 590,320"/>

  <!-- lb to PG primary -->
  <path class="arr" d="M350,320 L350,280"/>

  <!-- HAProxy stats -->
  <text x="690" y="350" class="sub">db.lab.test:5000 (CNAME → lb)</text>
  <text x="690" y="370" class="sub">statystyki: lb.lab.test:7000</text>

  <!-- etcd cluster ring -->
  <path class="arrd" d="M390,240 L410,240"/>
  <path class="arrd" d="M530,240 L550,240"/>
  <path class="arrd" d="M610,280 C610,300 470,300 470,280"/>

  <!-- Legend -->
  <rect x="20" y="430" width="14" height="14" class="infra"/>
  <text x="40" y="442" class="sub">infra (DNS+NTP)</text>
  <rect x="160" y="430" width="14" height="14" class="vm"/>
  <text x="180" y="442" class="sub">Węzeł PG (Patroni+etcd)</text>
  <rect x="320" y="430" width="14" height="14" class="lb"/>
  <text x="340" y="442" class="sub">load balancer</text>
  <rect x="430" y="430" width="14" height="14" class="cli"/>
  <text x="450" y="442" class="sub">orchestrator + klient</text>
  <rect x="600" y="430" width="14" height="14" class="host"/>
  <text x="620" y="442" class="sub">Host Windows (bez Linux tools)</text>
</svg>
