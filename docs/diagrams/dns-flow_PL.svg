<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" font-family="Segoe UI, sans-serif" font-size="13">
  <defs>
    <style>
      .box  { fill: #f7fbff; stroke: #336791; stroke-width: 1.5; }
      .nrpt { fill: #fff3e0; stroke: #e69500; stroke-width: 1.5; }
      .res  { fill: #e6f4ea; stroke: #1b873b; stroke-width: 1.5; }
      .ext  { fill: #f3e8ff; stroke: #6f42c1; stroke-width: 1.5; }
      .lbl  { font-weight: 600; fill: #1a1a1a; }
      .sub  { font-size: 11px; fill: #555; }
      .arr  { stroke: #555; stroke-width: 1.2; fill: none; marker-end: url(#arrd); }
    </style>
    <marker id="arrd" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#555"/>
    </marker>
  </defs>

  <text x="450" y="28" text-anchor="middle" class="lbl" font-size="18">Rozwiązywanie DNS — od hosta Windows do infra</text>
  <text x="450" y="48" text-anchor="middle" class="sub">Resolve-DnsName pg2.lab.test → 192.168.56.12</text>

  <!-- 1. Application -->
  <rect x="40" y="100" width="180" height="80" rx="6" class="box"/>
  <text x="130" y="124" text-anchor="middle" class="lbl">PowerShell / psql / MobaXterm</text>
  <text x="130" y="144" text-anchor="middle" class="sub">zapytanie: pg2.lab.test</text>
  <text x="130" y="162" text-anchor="middle" class="sub">wywołanie DNS Client API</text>

  <!-- 2. NRPT -->
  <rect x="280" y="100" width="180" height="80" rx="6" class="nrpt"/>
  <text x="370" y="124" text-anchor="middle" class="lbl">Windows DNS Client</text>
  <text x="370" y="144" text-anchor="middle" class="sub">NRPT: reguła *.lab.test</text>
  <text x="370" y="162" text-anchor="middle" class="sub">→ 192.168.56.10</text>

  <!-- 3. Infra Unbound -->
  <rect x="520" y="100" width="180" height="80" rx="6" class="res"/>
  <text x="610" y="124" text-anchor="middle" class="lbl">infra Unbound</text>
  <text x="610" y="144" text-anchor="middle" class="sub">autorytatywny dla lab.test</text>
  <text x="610" y="162" text-anchor="middle" class="sub">local-data: pg2 IN A 192.168.56.12</text>

  <!-- 4. Answer back -->
  <rect x="760" y="100" width="120" height="80" rx="6" class="box"/>
  <text x="820" y="124" text-anchor="middle" class="lbl">Rekord A</text>
  <text x="820" y="144" text-anchor="middle" class="sub">192.168.56.12</text>

  <!-- arrows top row -->
  <path class="arr" d="M220,140 L280,140"/>
  <path class="arr" d="M460,140 L520,140"/>
  <path class="arr" d="M700,140 L760,140"/>

  <!-- Section divider -->
  <line x1="40" y1="220" x2="860" y2="220" stroke="#aaa" stroke-dasharray="4 3"/>
  <text x="450" y="240" text-anchor="middle" class="lbl">Dla nazw spoza lab.test</text>

  <!-- below -->
  <rect x="40" y="260" width="180" height="60" rx="6" class="box"/>
  <text x="130" y="282" text-anchor="middle" class="sub">zapytanie: example.com</text>
  <text x="130" y="300" text-anchor="middle" class="sub">wywołanie DNS Client API</text>

  <rect x="280" y="260" width="180" height="60" rx="6" class="nrpt"/>
  <text x="370" y="282" text-anchor="middle" class="sub">NRPT: brak reguły dla example.com</text>
  <text x="370" y="300" text-anchor="middle" class="sub">użyj DNS adaptera</text>

  <rect x="520" y="260" width="180" height="60" rx="6" class="ext"/>
  <text x="610" y="282" text-anchor="middle" class="sub">DNS firmowy / ISP</text>
  <text x="610" y="300" text-anchor="middle" class="sub">rozwiązuje normalnie</text>

  <path class="arr" d="M220,290 L280,290"/>
  <path class="arr" d="M460,290 L520,290"/>

  <!-- legend -->
  <rect x="40" y="370" width="14" height="14" class="nrpt"/>
  <text x="60" y="382" class="sub">punkt decyzyjny NRPT</text>
  <rect x="220" y="370" width="14" height="14" class="res"/>
  <text x="240" y="382" class="sub">infra (autorytatywna dla lab.test)</text>
  <rect x="440" y="370" width="14" height="14" class="ext"/>
  <text x="460" y="382" class="sub">resolver zewnętrzny (firma/ISP)</text>
  <rect x="640" y="370" width="14" height="14" class="box"/>
  <text x="660" y="382" class="sub">aplikacja lub odpowiedź</text>
</svg>
